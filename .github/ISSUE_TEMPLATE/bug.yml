name: Bug report
description: Report reproducible module behavior
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never attach state, `.env`, `terraform.tfvars`, `plane.env`, tokens, or secrets.
  - type: input
    id: version
    attributes:
      label: Module version
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: cli
    attributes:
      label: CLI and version
      placeholder: OpenTofu 1.12.5
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized output
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, state, plans, personal data, and production identifiers.
          required: true
