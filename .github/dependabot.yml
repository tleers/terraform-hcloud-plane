version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directory: /
    schedule:
      interval: weekly
    groups:
      terraform-providers:
        patterns: ["*"]

  - package-ecosystem: terraform
    directory: /examples/basic
    schedule:
      interval: monthly

  - package-ecosystem: terraform
    directory: /examples/complete
    schedule:
      interval: monthly
